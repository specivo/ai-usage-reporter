name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  # The runtime must stay standard-library only: install the wheel into a clean
  # environment without the dev group and run the CLI.
  stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - run: uv venv /tmp/clean --python 3.11
      - run: uv pip install --python /tmp/clean dist/*.whl
      - run: /tmp/clean/bin/ai-usage --version
      - run: /tmp/clean/bin/python -c "import ai_usage_reporter.cli, ai_usage_reporter.testing"
